name: release

# On merge to master: re-run the verification gate, let release-please maintain the
# Release PR / cut the tag+Release, then — only when a release is actually created —
# build and push the multi-arch images to ghcr. The image job lives in this same
# workflow (gated on release-please's release_created output) so it is not blocked
# by the GITHUB_TOKEN "events don't trigger other workflows" caveat.
#
# Publishing was approved by the owner as of v2.0.0 (the Go rebuild). Two images
# are pushed per release, each tagged with the release tag and `latest`:
#   ghcr.io/gsdevme/solis-inverter-manager          (Go manager, ./Dockerfile)
#   ghcr.io/gsdevme/solis-inverter-manager-sidecar  (Python sidecar, sidecar/Dockerfile)
# Both packages must be public on ghcr so the cluster can pull without an
# imagePullSecret (a one-off setting on the package page after the first push).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a run that may be cutting a tag / pushing an image.
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  release-please:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
          labels: |
            org.opencontainers.image.source=https://github.com/gsdevme/solis-inverter-manager
          tags: |
            ghcr.io/gsdevme/solis-inverter-manager:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/gsdevme/solis-inverter-manager:latest
      - name: build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sidecar/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
          labels: |
            org.opencontainers.image.source=https://github.com/gsdevme/solis-inverter-manager
          tags: |
            ghcr.io/gsdevme/solis-inverter-manager-sidecar:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/gsdevme/solis-inverter-manager-sidecar:latest
