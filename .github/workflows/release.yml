name: release

# On merge to master: re-run the verification gate, let release-please maintain the
# Release PR / cut the tag+Release, then — only when a release is actually created —
# BUILD the multi-arch images. The image job lives in this same workflow (gated on
# release-please's release_created output) so it is not blocked by the GITHUB_TOKEN
# "events don't trigger other workflows" caveat.
#
# GUARDRAIL: no container image is published until the owner approves. This image
# job is therefore build-only (push: false). To enable publishing once approved:
#   1. set push: true on both build steps,
#   2. add a ghcr login before them:
#        - uses: docker/login-action@v3
#          with: { registry: ghcr.io, username: ${{ github.actor }},
#                   password: ${{ secrets.GITHUB_TOKEN }} }
#   3. grant the image job `permissions: { contents: read, packages: write }`,
#   4. add tags:/labels: pointing at ghcr.io/gsdevme/solis-inverter-manager and a
#      sidecar repo.
# See the sibling hyundai-bluelink-mqtt release.yml for the exact push shape.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a run that may be cutting a tag / (eventually) pushing an image.
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  release-please:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Build-only multi-arch validation of the release artifacts. push stays false
      # per the guardrail above until the owner approves publishing.
      - name: build manager image (multi-arch, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: build sidecar image (multi-arch, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sidecar/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
