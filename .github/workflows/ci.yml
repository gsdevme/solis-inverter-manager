name: ci

# Pull-request gate: the full verification suite via checks.yml — the Go manager
# (vet/lint/test/e2e) and the Python sidecar (ruff + pytest) — plus a build-only
# Docker validation that catches Dockerfile breakage in both images before merge.
#
# Nothing in this workflow ever publishes. The docker-build job builds the
# manager and sidecar images with `push: false` on native linux/amd64 only,
# which is enough Dockerfile-breakage signal without paying for the emulated
# arm64 leg on every PR.
#
# Publishing lives exclusively in release.yml: its `image` job is gated on
# release-please's `release_created` output and pushes both images multi-arch
# (linux/amd64,linux/arm64) to ghcr.io, tagged with the release tag and
# `latest`. Branch pushes and pull requests never publish.
on:
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only (push: false), native amd64 only: the emulated arm64 leg is slow
      # and adds little Dockerfile-breakage signal for a static CGO_ENABLED=0
      # GOOS=linux binary; the full multi-arch build happens at release time. Both
      # images build from the repo root; scoped gha caches keep them independent.
      - name: build manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: build sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sidecar/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
