name: ci

# Pull-request gate: the full Go verification suite (lint/test/e2e) plus a
# build-only Docker validation (no push) that catches Dockerfile breakage in both
# images before merge. Image publishing lives in release.yml and is itself
# build-only pending owner approval (see the guardrail note there).
on:
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only (push: false), native amd64 only: the emulated arm64 leg is slow
      # and adds little Dockerfile-breakage signal for a static CGO_ENABLED=0
      # GOOS=linux binary; the full multi-arch build happens at release time. Both
      # images build from the repo root; scoped gha caches keep them independent.
      - name: build manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: build sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sidecar/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
